# GitHub Secret Scanning configuration
# Excludes paths that contain intentional demo/test credentials.
# Real secrets are never committed; these are synthetic placeholder values.

paths-ignore:
  # Demo seed scripts contain known-fake credentials for test personas
  - "scripts/seed-demo-org.ts"
  # Validation scripts may contain demo email addresses used in test assertions
  - "scripts/validate-auth.ts"
  - "scripts/validate-lighthouse.ts"
  # SQL seed data contains no real secrets but may trigger pattern matches
  - "sql/**"
