name: Security

on:
  push:
    branches: [main, "claude/**", "sprint-*"]
    paths:
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        # Fail on high or critical vulnerabilities only.
        # Moderate issues are reported but do not block the build.
        run: npm audit --audit-level=high

      - name: Upload audit report
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Archive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
